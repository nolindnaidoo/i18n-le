# The Rust CLI's CI.
#
# This repo is crate-only: there is no extension beside it yet, so the `parity`
# and `differential` jobs the two-frontend siblings run have nothing to compare
# and are deliberately absent rather than present and vacuous. They arrive with
# the extension.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a commit with
  # no way to be verified. Dispatch is the escape hatch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `#[expect]` is `#[allow]` that complains when it stops being
      # needed. It is still an inline suppression, and a gate that greps
      # for one spelling and not the other is a gate that gets routed
      # around by accident — ips-le carried an `#[expect(dead_code)]`
      # under a green policy job. `tests/` is included: the rule is
      # crate-wide, and a test is not an exemption.
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rnE '#!?\[[^]]*\b(allow|expect)\(' \
              crate/src crate/tests --include='*.rs'; then
            echo 'Inline #[allow]/#[expect] found — fix the lint, or add a commented'
            echo 'relaxation to [lints.clippy] or [lints.rust] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi
      # The rule lives in scripts/check-agent-files.py, which the extension repos
      # run from their vitest suite. It was written twice once — here and there —
      # which is "define it once" broken inside the gate that enforces the
      # family's rules, and the two had already diverged.
      - name: The agent instruction files are one document
        working-directory: .
        run: python3 scripts/check-agent-files.py

  # AGENTS.md sets a 90% line coverage floor per *pure* module — the ones
  # that take text and return findings, with no filesystem under them.
  # Enforced per module, not on the total: a total hides one module sliding
  # while the others carry it. The names are listed rather than matched on
  # a directory, so deleting or renaming one turns this job red instead of
  # quietly making it check nothing.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is exactly
        # when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on detect/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          PURE = {"audit.rs", "catalogue.rs", "library.rs", "locale.rs", "message.rs"}
          files = json.load(open("coverage.json"))["data"][0]["files"]
          measured, under = set(), []
          for f in files:
              name = f["filename"].split("/")[-1]
              if name not in PURE:
                  continue
              measured.add(name)
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:20} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          missing = PURE - measured
          if missing:
              print(f"\nThese pure modules were not measured at all: {sorted(missing)}")
              print("Either they were renamed and this list is stale, or the report is wrong.")
              sys.exit(1)
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per pure module:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # Documents and filesystems that break tools, against the built
  # binary. Every tree is built at runtime, because Windows cannot check
  # in a FIFO, a symlink loop or a mode-000 file — and every case the
  # platform cannot express says so by name rather than passing quietly.
  #
  # Found in this pass: the call-site scan checked a source file's size
  # and never its kind, so `read_to_string` on a FIFO named `app.ts`
  # blocked forever. The case ran past two minutes before the fix and
  # takes 0.2s after it.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous catalogues and filesystems against the built binary
        run: cargo test --locked --test hazards -- --nocapture

  # Behaviour that differs by operating system. A sibling shipped a
  # release whose report used `\` on Windows and `/` everywhere else, red
  # on Windows CI for the whole release before anyone looked. stdout here
  # is protocol and the report is meant to be diffed between machines, so
  # the separator is asserted on all three rather than assumed.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Separators, TZ, case folding, reserved names, CRLF and stdio
        run: cargo test --locked --test platform -- --nocapture
      # Windows ignores TZ entirely, so a suite that quietly depended on
      # it would be red there and nowhere else. Both runs are compared
      # line for line rather than merely required to pass.
      - name: The suite answers the same with TZ set and unset
        shell: bash
        run: |
          set -euo pipefail
          # Names and outcomes, not the summary lines: those carry a
          # duration, and two runs of the same suite never agree on one.
          names() { grep -E '^test ' | grep -v '^test result:' | sort; }
          TZ=UTC cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-utc.txt"
          unset TZ
          cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-unset.txt"
          test -s "$RUNNER_TEMP/tz-utc.txt"
          diff -u "$RUNNER_TEMP/tz-utc.txt" "$RUNNER_TEMP/tz-unset.txt"

  # The corpus pins the cases somebody thought of; this generates the
  # ones nobody did and feeds them to `check_catalogues`, the MCP tool
  # that takes catalogue text and reads no file.
  #
  # The target is every decision the placeholder lexer makes on text
  # somebody else wrote: `{{` as a variable under one grammar and ICU's
  # literal brace under the rest, a plural construct stepped over by a
  # brace counter that must terminate when the braces do not balance,
  # `%` as printf or as a percentage in prose, `$t(` as a key reference
  # or a foreign construct. Every generated catalogue also carries one
  # distinctive sentence as a value, and it may never appear in any
  # answer on either stream — the privacy boundary held under generated
  # input rather than only under the cases somebody thought of.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      I18N_LE_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Sixty seconds against the lexer and the precedence rule
        run: cargo test --locked --test fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a corpus generated from a fixed seed, plus
  # linearity in three directions: four times the keys in one catalogue,
  # four times the locales, and four times the duplicates in one object.
  #
  # The first is the one that matters. Duplicate resolution scanned every
  # pair for every pair, so a flat catalogue cost time in the square of
  # its key count — 6,000 keys in 1.56s and 24,000 in 24.54s, which is
  # 15.7x the clock for 4x the keys. Every fixture was small enough that
  # a green suite said nothing about it.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      I18N_LE_BUDGET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: A 25-locale set inside its budget, and linear in three directions
        run: cargo test --locked --test budget -- --test-threads=1 --nocapture

  # Does the crate find what it claims to find?
  #
  # Every library, layout shape, evidence class, finding kind, severity,
  # foreign construct, mark, diagnostic code, status and refusal reason
  # has to be reachable from a real project through the built binary —
  # and nothing the code produces may be missing from those lists. A
  # value produced and undocumented is a report a consumer branches on
  # and cannot look up; a value documented and unreachable is a promise
  # nobody has checked. Its first run found six of the first kind.
  #
  # The marker check is not decoration: `cargo test <filter>` exits 0
  # when the filter matches nothing, so a renamed test would pass this
  # job silently.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every library, kind, construct, mark, status and refusal
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test coverage_matrix -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/matrix.txt"
          found=$(grep -c '^coverage-matrix: ' "$RUNNER_TEMP/matrix.txt" || true)
          if [ "$found" -lt 8 ]; then
            echo "Only $found coverage-matrix markers, expected 8 — a test was"
            echo "renamed or filtered out, and this job would have passed silently."
            exit 1
          fi

  # A set larger than an editor opens. Gated so a bare `cargo test` stays
  # fast, not because it is optional — a skipped scenario says so by name
  # and is never reported as a pass.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      I18N_LE_SCENARIOS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Four thousand keys across twenty-three locales
        run: cargo test --locked --test scenarios -- --nocapture

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-audit
      - run: cargo audit

  # The commit convention was claimed by .githooks/commit-msg and by
  # AGENTS.md, and enforced by neither: core.hooksPath is opt-in per
  # clone, so `--no-verify` or a fresh checkout skipped it permanently
  # rather than deferring it. Three separate audits flagged the same
  # false claim. This is the gate that makes it true.
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every pushed commit is conventional
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._,/ -]+\))?!?: .+'
          fail=0
          while read -r sha subject; do
            case "$subject" in "Merge "*|"Revert "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "not conventional: $sha $subject"; fail=1
            fi
          done < <(git log --no-merges --format='%h %s' "$base..HEAD")
          exit $fail
